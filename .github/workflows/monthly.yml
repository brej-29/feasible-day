name: Monthly update

# Refreshes news notices and compiles city requests, then opens a pull request for a human to review and merge.
# LLM secrets are optional: without LLM_API_KEY the notices step is skipped and the requests digest still runs.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency: monthly

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run monthly job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_FALL_1: ${{ secrets.LLM_MODEL_FALL_1 }}
          LLM_MODEL_FALL_2: ${{ secrets.LLM_MODEL_FALL_2 }}
          LLM_PRICE_IN_PER_M: ${{ secrets.LLM_PRICE_IN_PER_M }}
          LLM_PRICE_OUT_PER_M: ${{ secrets.LLM_PRICE_OUT_PER_M }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD }}
        run: npm run monthly
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing changed"; exit 0; fi
          month=$(date -u +%Y-%m)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "monthly/$month"
          git add public/notices.json docs/REQUESTS.md data/ledger.json
          git commit -m "Monthly update $month: notices and city requests"
          git push --force-with-lease origin "monthly/$month"
          gh pr create --base main --head "monthly/$month" \
            --title "Monthly update $month" \
            --body "Automated notices (news headlines, not verified) and the city-request digest in docs/REQUESTS.md. Review both before merging. Merging to main redeploys the Space when the HF_TOKEN secret is set."
