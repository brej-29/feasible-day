<g class="ping" style="animation-delay:3.00s"><circle cx="818.2" cy="170" r="9" fill="#14783a"/><path d="M813.7 170 l3.2 3.4 l5.6 -6.4" fill="none" stroke="#fff" stroke-width="2.2"/></g>
<g class="arm" style="animation-delay:0.55s"><polygon points="177.0,226 233.0,226 241.0,237.0 233.0,248 177.0,248" fill="#ffd21f"/><text x="205.0" y="242" text-anchor="middle" class="t" font-size="14" fill="#14181c">8 MIN</text></g>
<g class="arm" style="animation-delay:0.90s"><polygon points="263.4,226 319.4,226 327.4,237.0 319.4,248 263.4,248" fill="#ffd21f"/><text x="291.4" y="242" text-anchor="middle" class="t" font-size="14" fill="#14181c">8 MIN</text></g>
