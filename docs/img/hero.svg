<rect class="bar" style="animation-delay:2.05s" x="592.9" y="184" width="63.7" height="34" fill="url(#h)" stroke="#ffffff" stroke-width="2"/>
<g class="ping" style="animation-delay:2.30s"><circle cx="624.8" cy="170" r="9" fill="#8a7a3a"/><text x="624.8" y="174" text-anchor="middle" class="t" font-size="13" fill="#fff">?</text></g>
<rect class="bar" style="animation-delay:2.40s" x="673.7" y="184" width="93.5" height="34" fill="#ffd21f" stroke="#ffffff" stroke-width="2"/>
