<g class="arm" style="animation-delay:1.95s"><polygon points="553.8,226 609.8,226 617.8,237.0 609.8,248 553.8,248" fill="#ffd21f"/><text x="581.8" y="242" text-anchor="middle" class="t" font-size="14" fill="#14181c">10 MIN</text></g>
<g class="arm" style="animation-delay:2.30s"><polygon points="633.2,226 689.2,226 697.2,237.0 689.2,248 633.2,248" fill="#ffd21f"/><text x="661.2" y="242" text-anchor="middle" class="t" font-size="14" fill="#14181c">12 MIN</text></g>
<g class="arm" style="animation-delay:2.65s"><polygon points="742.2,226 798.2,226 806.2,237.0 798.2,248 742.2,248" fill="#ffd21f"/><text x="770.2" y="242" text-anchor="middle" class="t" font-size="14" fill="#14181c">10 MIN</text></g>
<rect x="90" y="336" width="22" height="14" fill="#ffd21f" stroke="#fff" stroke-width="1.5"/><text x="120" y="348" class="s" font-size="15" fill="#c9d1d6">hours checked</text>
<rect x="260" y="336" width="22" height="14" fill="url(#h)" stroke="#fff" stroke-width="1.5"/><text x="290" y="348" class="s" font-size="15" fill="#c9d1d6">hours unverified (never guessed)</text>
<polygon points="560,336 578,336 584,343 578,350 560,350" fill="#ffd21f"/><text x="594" y="348" class="s" font-size="15" fill="#c9d1d6">walking transfer checked against the clock</text>
<text x="1110" y="348" text-anchor="end" class="s" font-size="13" fill="#6f7b84">illustration</text>
